name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - pyproject.toml
      - src/antigravity_agentkit/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - pyproject.toml
      - src/antigravity_agentkit/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10","3.11","3.12"]') }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: antigravity_agentkit
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: bash dev/setup.sh --deps "development"
      - name: Vulture (dead code)
        run: uv run vulture
      - name: Run tests
        run: uv run bash dev/test_python.sh
      - name: Test build
        run: uv run bash dev/build.sh
      - name: Trunk Check
        if: matrix.python-version == '3.12' && github.event_name != 'push'
        uses: trunk-io/trunk-action@v1
